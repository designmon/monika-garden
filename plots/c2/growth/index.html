<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dinner Circle</title>
  <style>
    :root{--ink:#25211d;--muted:#625b52;--paper:#f5efe4;--card:#fffaf0;--line:#cfc0a5;--table:#694431;--sage:#5f8067;--blue:#496e91;--fig:#90485f;--gold:#c89735;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(90deg,rgba(73,110,145,.08) 1px,transparent 1px),linear-gradient(0deg,rgba(95,128,103,.08) 1px,transparent 1px),var(--paper);background-size:42px 42px;color:var(--ink)}
    button,input,select,textarea{font:inherit}.shell{width:min(1120px,calc(100% - 28px));margin:auto;padding:18px 0 28px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.back{color:var(--muted);font-weight:750;text-decoration:none;border-bottom:1px solid}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:rgba(255,250,240,.78);color:var(--muted);font-size:.88rem;font-weight:750}
    .hero{display:grid;grid-template-columns:minmax(0,.72fr) minmax(250px,.5fr);gap:clamp(18px,4vw,44px);align-items:center;margin-bottom:20px}h1{margin:0 0 10px;max-width:11ch;color:#38291f;font-size:clamp(2.3rem,5vw,4.1rem);line-height:.98;letter-spacing:0}.lede{max-width:62ch;margin:0;color:var(--muted);font-size:1.05rem;line-height:1.55}
    .table{position:relative;width:min(76vw,320px);aspect-ratio:1;margin:auto;border-radius:50%;background:radial-gradient(circle,rgba(255,250,240,.28) 0 22%,transparent 23%),conic-gradient(from 18deg,#4f3023,#84553c,#5a3527,#7a4b32,#4f3023);box-shadow:0 22px 60px rgba(49,37,22,.16)}.plate{--a:0deg;--c:var(--sage);position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;transform:rotate(var(--a)) translateY(-160px) rotate(calc(-1 * var(--a)));border-radius:50%;background:radial-gradient(circle,#fff 0 45%,var(--c) 46% 53%,#fffaf0 54%);box-shadow:0 8px 18px rgba(49,37,22,.16)}.plate:nth-child(2){--a:45deg;--c:var(--blue)}.plate:nth-child(3){--a:90deg;--c:var(--fig)}.plate:nth-child(4){--a:135deg;--c:var(--gold)}.plate:nth-child(5){--a:180deg}.plate:nth-child(6){--a:225deg;--c:var(--blue)}.plate:nth-child(7){--a:270deg;--c:var(--fig)}.plate:nth-child(8){--a:315deg;--c:var(--gold)}
    .work{display:grid;grid-template-columns:minmax(0,.78fr) minmax(320px,.62fr);gap:16px;align-items:start}.panel{border:1px solid var(--line);border-radius:8px;background:rgba(255,250,240,.9);box-shadow:0 16px 42px rgba(49,37,22,.14);padding:16px}.panel+.panel{margin-top:12px}h2,h3{margin:0 0 10px;color:#342820;line-height:1.18;letter-spacing:0}h2{font-size:1.15rem}h3{font-size:1rem}
    label{display:grid;gap:6px;color:var(--muted);font-size:.85rem;font-weight:780}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fffdf6;color:var(--ink);padding:10px}textarea{min-height:104px;resize:vertical;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stack{display:grid;gap:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button{min-height:40px;border:1px solid var(--table);border-radius:999px;background:var(--table);color:#fffaf0;padding:0 15px;font-weight:800;cursor:pointer}button.secondary{border-color:var(--line);background:#fffaf0;color:var(--ink)}.saved{color:var(--blue);min-height:20px;font-size:.85rem;font-weight:760}
    .rows{display:grid;gap:8px}.seats{grid-template-columns:repeat(2,minmax(0,1fr))}.item{border:1px solid var(--line);border-radius:8px;background:#fffdf6;padding:9px 10px;min-width:0}.bridge{border-color:rgba(144,72,95,.35);background:rgba(144,72,95,.08)}.memory{border-color:rgba(95,128,103,.35);background:rgba(95,128,103,.08)}.item strong,.item span{display:block;overflow-wrap:anywhere}.item span,li,.invite{color:var(--muted);font-size:.9rem;line-height:1.42;overflow-wrap:anywhere}.item span{margin-top:3px}ul{margin:0;padding-left:1.1rem}.invite{margin:0;white-space:pre-wrap}
    @media(max-width:860px){.hero,.work{grid-template-columns:1fr}.table{width:min(72vw,270px)}.plate{transform:rotate(var(--a)) translateY(-135px) rotate(calc(-1 * var(--a)))}}@media(max-width:620px){.shell{width:min(100% - 20px,1120px)}.top{align-items:flex-start;flex-direction:column}.pill,.grid{width:100%;grid-template-columns:1fr}.seats{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="top" aria-label="Garden navigation"><a class="back" href="../../../viewer/">Back to garden</a><div class="pill" id="cadence"></div></nav>
    <section class="hero" aria-labelledby="title">
      <div><h1 id="title">Dinner Circle</h1><p class="lede">A table-shaped companion for hosting every couple of months: eight seats, a warm reason to gather, and a small memory that helps the next circle begin.</p></div>
      <div class="table" aria-hidden="true"><span class="plate"></span><span class="plate"></span><span class="plate"></span><span class="plate"></span><span class="plate"></span><span class="plate"></span><span class="plate"></span><span class="plate"></span></div>
    </section>
    <section class="work" aria-label="Dinner circle planner">
      <section class="panel stack">
        <h2>Set the circle</h2>
        <div class="grid"><label>Intention<select id="intent"><option value="reconnect">Reconnect old threads</option><option value="cross">Cross-pollinate worlds</option><option value="welcome">Welcome newer people</option><option value="spark">Spark stories</option></select></label><label>Dinner date<input id="date" type="date"></label></div>
        <label>People on your mind<textarea id="people" placeholder="One per line: Ania, design friend and vegetarian, months ago"></textarea></label>
        <label>Tiny logistics to remember<textarea id="care" placeholder="Dietary care, date windows, kitchen limits, people to seat near or apart"></textarea></label>
        <div class="actions"><button id="shape" type="button">Shape table</button><button id="saveDraft" class="secondary" type="button">Save draft</button><span class="saved" id="saved"></span></div>
      </section>
      <aside>
        <section class="panel"><h3>Eight seats</h3><div class="rows seats" id="seats"></div></section>
        <section class="panel"><h3>Why this table</h3><div class="rows" id="bridges"></div></section>
        <section class="panel"><h3>Evening spine</h3><ul id="spine"></ul></section>
        <section class="panel"><h3>Invitation draft</h3><p class="invite" id="invite"></p></section>
        <section class="panel stack"><h3>Table memory</h3><label>One thing that kept glowing<textarea id="aftertaste" placeholder="The story everyone returned to, an unexpected pair, a dish that made the room easier"></textarea></label><div class="actions"><button id="remember" class="secondary" type="button">Remember table</button></div><div class="rows" id="memories"></div></section>
      </aside>
    </section>
  </main>
  <script>
    const plans={reconnect:{title:"low-pressure reconnection dinner",seats:["old friend","old friend","newer friend","work thread","neighboring world","quiet listener","story carrier","you"],spine:["Ask for one small good thing from the last month.","Serve one familiar main and one bright side.","Seat old trust near newer people.","Close with coffee, tea, and one question about what everyone wants more of this season."],invite:"I am starting a small rhythm of dinners every couple of months, and I would love you at the next one. Nothing formal: eight people, simple food, and a reason to see each other properly."},cross:{title:"cross-pollination table",seats:["old tie","work mind","creative friend","newer friend","different city","good question asker","wild card","you"],spine:["Invite around one shared curiosity, not a theme night.","Seat people by unlikely overlap.","Keep food abundant but unfussy.","Begin with how each person knows you, then let the table find its own map."],invite:"I keep thinking you would enjoy being in a room with a few people from other corners of my life. I am hosting a small dinner for eight, simple and warm, built around good overlap rather than networking."},welcome:{title:"welcome table",seats:["newer friend","newer friend","old anchor","old anchor","warm connector","work thread","neighboring world","you"],spine:["Choose two anchor guests who make rooms easier.","Keep the menu recognizable and generous.","Put one gentle prompt near each place.","Send a same-night thank-you note while the warmth is present."],invite:"I am hosting a small dinner and would love to fold you into this part of my life. It will be eight people, relaxed food, and the kind of evening where nobody has to perform."},spark:{title:"spark dinner",seats:["story carrier","maker","sharp observer","old friend","newer friend","work mind","wild card","you"],spine:["Ask guests to bring one object, question, or recommendation.","Keep the meal modular so the host is not trapped in the kitchen.","Seat the highest-energy talkers apart.","End by collecting everyone's one sentence from the evening."],invite:"I am putting together a small dinner for curious people: eight seats, simple food, and one tiny offering from each guest."}};
    const key="dinner-circle-c2",$=id=>document.getElementById(id),f=["intent","date","people","care"].reduce((a,id)=>({...a,[id]:$(id)}),{});
    const clean=v=>String(v||"").replace(/\s+/g," ").trim(),rank=t=>{t=t.toLowerCase();return t.includes("not yet")?5:t.includes("year")?4:t.includes("month")?3:t.includes("recent")?1:t.includes("hosted")?0:2};
    function people(){return f.people.value.split("\n").map(line=>{const p=line.split(",").map(clean).filter(Boolean),name=p.shift()||"",rec=p.find(x=>/not yet|year|month|recent|hosted/i.test(x))||"not yet";return{name,note:p.filter(x=>x!==rec).join(", "),rec}}).filter(p=>p.name).sort((a,b)=>rank(b.rec)-rank(a.rec)).slice(0,8)}
    function guests(){const plan=plans[f.intent.value],ps=people();return plan.seats.map((label,i)=>ps[i]?{name:ps[i].name,note:ps[i].note||label,mem:ps[i].rec}:{name:`Seat ${i+1}`,note:label,mem:"open seat"})}
    const names=gs=>gs.map(g=>g.name).filter(n=>!/^Seat \d+$/.test(n)&&n.toLowerCase()!=="you");
    function mems(){try{const m=JSON.parse(localStorage.getItem(`${key}-memories`)||"[]");return Array.isArray(m)?m.slice(-6):[]}catch{localStorage.removeItem(`${key}-memories`);return[]}}
    const saveM=m=>localStorage.setItem(`${key}-memories`,JSON.stringify(m.slice(-6)));
    function nudge(gs){const ns=names(gs),m=mems().filter(x=>Array.isArray(x.guests));if(!ns.length||!m.length)return"";const recent=new Set(m.slice(-2).flatMap(x=>x.guests)),wait=ns.find(n=>!recent.has(n));return wait?`${wait} has not appeared in the last saved table; consider giving that seat priority.`:"Everyone named here is recent; add one older thread before repeating the same circle."}
    function list(el,cls,rows){el.innerHTML="";rows.forEach(([a,b])=>{const d=document.createElement("div"),s=document.createElement("strong"),p=document.createElement("span");d.className=`item ${cls}`;s.textContent=a;p.textContent=b;d.append(s,p);el.append(d)})}
    function render(){const plan=plans[f.intent.value],gs=guests(),m=mems(),latest=m.at(-1),hint=nudge(gs);list($("seats"),"",gs.map(g=>[g.name,`${g.note} - ${g.mem}`]));list($("bridges"),"bridge",[[`${gs[0].name} + ${gs[2].name}`,`old trust gives the new person a softer landing; ${gs[0].mem} meets ${gs[2].mem}.`],[`${gs[1].name} + ${gs[6].name}`,`a familiar voice can draw out the wild-card story; ${gs[1].mem} meets ${gs[6].mem}.`],[`${gs[3].name} + ${gs[5].name}`,`work rhythm meets a steadier personal thread; ${gs[3].mem} meets ${gs[5].mem}.`]]);$("spine").innerHTML="";plan.spine.concat(hint?[`Saved-table nudge: ${hint}`]:[]).concat(clean(f.care.value)?[`Remember: ${clean(f.care.value)}`]:[]).forEach(x=>{const li=document.createElement("li");li.textContent=x;$("spine").append(li)});$("invite").textContent=`${plan.invite}\n\nWould you be free for a ${plan.title} sometime in the next few weeks?${latest?.aftertaste?`\n\nLast time, what stayed with me was: ${latest.aftertaste}`:""}`;renderMemories()}
    function renderMemories(){const m=mems(),rows=m.length?m.slice().reverse().map(x=>[x.date||"undated table",`${(x.guests||[]).join(", ")}${x.aftertaste?" - "+x.aftertaste:""}`]):[["No tables remembered yet","The first aftertaste will become material for the next invitation."]],hint=nudge(guests());list($("memories"),"memory",hint?[["For the next circle",hint],...rows]:rows)}
    function saveDraft(){localStorage.setItem(key,JSON.stringify({intent:f.intent.value,date:f.date.value,people:f.people.value,care:f.care.value}));$("saved").textContent="saved here";setTimeout(()=>{$("saved").textContent=""},1600)}
    function loadDraft(){try{const d=JSON.parse(localStorage.getItem(key)||"{}");Object.keys(f).forEach(id=>{if(d[id])f[id].value=d[id]})}catch{localStorage.removeItem(key)}}
    function remember(){const aftertaste=clean($("aftertaste").value);if(!aftertaste)return;const m=mems();m.push({date:f.date.value||new Date().toISOString().slice(0,10),guests:names(guests()),care:clean(f.care.value),aftertaste});saveM(m);$("aftertaste").value="";render()}
    function cadence(){const n=new Date(),next=new Date(n.getFullYear(),n.getMonth()+2,n.getDate());$("cadence").textContent=`Next circle: ${next.toLocaleDateString(undefined,{month:"long",day:"numeric"})}`}
    Object.values(f).forEach(x=>x.addEventListener("input",render));$("shape").addEventListener("click",render);$("saveDraft").addEventListener("click",saveDraft);$("remember").addEventListener("click",remember);f.date.value=new Date().toISOString().slice(0,10);loadDraft();cadence();render();
  </script>
</body>
</html>

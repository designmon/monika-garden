<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interesting Takes Engine</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171511;
      --muted: #655f55;
      --paper: #f8f3ea;
      --panel: #fffaf1;
      --line: #d8cabb;
      --coal: #28231d;
      --ember: #d65f35;
      --gold: #e5ae43;
      --mint: #7fb99b;
      --blue: #577f9e;
      --rose: #c9878d;
      --shadow: 0 24px 70px rgba(40, 35, 29, 0.14);
      font-family: ui-serif, Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 12%, rgba(229, 174, 67, 0.22), transparent 24rem),
        linear-gradient(135deg, #f8f3ea 0%, #efe4d2 48%, #dde7df 100%);
      color: var(--ink);
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 0 32px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 22px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: grid;
      gap: 4px;
    }

    .eyebrow {
      color: var(--ember);
      font: 700 0.78rem/1.1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 4.6rem;
      line-height: 0.92;
      letter-spacing: 0;
      max-width: 880px;
    }

    .garden-link {
      flex: 0 0 auto;
      color: var(--coal);
      text-decoration: none;
      border: 1px solid var(--line);
      background: rgba(255, 250, 241, 0.7);
      border-radius: 999px;
      padding: 10px 14px;
      font: 700 0.9rem/1 ui-sans-serif, system-ui, sans-serif;
    }

    main {
      display: grid;
      grid-template-columns: minmax(270px, 0.85fr) minmax(360px, 1.35fr);
      gap: 20px;
      align-items: stretch;
    }

    .bench,
    .kiln {
      border: 1px solid rgba(40, 35, 29, 0.14);
      background: rgba(255, 250, 241, 0.78);
      box-shadow: var(--shadow);
    }

    .bench {
      border-radius: 8px;
      padding: 18px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 18px;
      min-height: 0;
    }

    .bench h2,
    .kiln h2,
    .output h3 {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0;
    }

    .bench h2,
    .kiln h2 {
      font-size: 0.98rem;
      text-transform: uppercase;
      color: var(--muted);
    }

    .signal-stack,
    .value-grid,
    .voice-shelf,
    .voice-list,
    .saved-stack {
      display: grid;
      gap: 8px;
    }

    .signal {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf8;
      color: var(--coal);
      padding: 10px 12px;
      text-align: left;
      font: 700 0.96rem/1.2 ui-sans-serif, system-ui, sans-serif;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .signal:hover,
    .signal.active {
      transform: translateY(-1px);
      border-color: var(--ember);
      background: #fff5df;
    }

    .value-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .value {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fffdf8;
      color: var(--coal);
      padding: 9px 10px;
      font: 700 0.82rem/1 ui-sans-serif, system-ui, sans-serif;
      white-space: nowrap;
    }

    .value.active {
      border-color: var(--coal);
      background: var(--coal);
      color: #fffaf1;
    }

    .voice-shelf {
      grid-template-columns: 1fr;
    }

    .voice-controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
    }

    .voice-controls input {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fffdf8;
      color: var(--coal);
      padding: 9px 12px;
      outline: none;
      font: 0.9rem/1.2 ui-sans-serif, system-ui, sans-serif;
    }

    .voice-controls input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(87, 127, 158, 0.16);
    }

    .voice-controls button,
    .voice-chip button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fffdf8;
      color: var(--coal);
      font: 900 1rem/1 ui-sans-serif, system-ui, sans-serif;
      display: inline-grid;
      place-items: center;
    }

    .voice-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .voice-column {
      border: 1px solid rgba(40, 35, 29, 0.12);
      border-radius: 8px;
      background: rgba(255, 253, 248, 0.62);
      padding: 8px;
      min-width: 0;
      display: grid;
      align-content: start;
      gap: 6px;
    }

    .voice-column h3 {
      margin: 0;
      color: var(--muted);
      font: 800 0.72rem/1 ui-sans-serif, system-ui, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    #voiceLikes,
    #voiceAvoids {
      display: grid;
      gap: 6px;
    }

    .voice-chip {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 6px;
      border-radius: 8px;
      background: rgba(255, 250, 241, 0.82);
      padding: 6px 6px 6px 9px;
      color: var(--coal);
      font: 0.82rem/1.25 ui-sans-serif, system-ui, sans-serif;
    }

    .voice-chip span {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .voice-chip button {
      width: 24px;
      height: 24px;
      font-size: 0.86rem;
    }

    .saved-stack {
      overflow: auto;
      min-height: 108px;
      max-height: 230px;
      padding-right: 2px;
    }

    .saved {
      border: 1px solid rgba(40, 35, 29, 0.12);
      border-radius: 8px;
      background: rgba(255, 253, 248, 0.8);
      padding: 10px;
      display: grid;
      gap: 6px;
    }

    .saved strong {
      font: 800 0.8rem/1.2 ui-sans-serif, system-ui, sans-serif;
      color: var(--ember);
      text-transform: uppercase;
    }

    .saved span {
      font-size: 0.92rem;
      line-height: 1.3;
      color: var(--coal);
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 14px;
      font: 0.94rem/1.35 ui-sans-serif, system-ui, sans-serif;
    }

    .kiln {
      border-radius: 8px;
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
    }

    .kiln-top {
      padding: 18px 18px 0;
      display: grid;
      gap: 12px;
    }

    textarea {
      width: 100%;
      min-height: 104px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf8;
      color: var(--ink);
      padding: 14px;
      line-height: 1.45;
      outline: none;
    }

    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(87, 127, 158, 0.16);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .primary,
    .secondary {
      min-height: 42px;
      border-radius: 999px;
      padding: 10px 16px;
      font: 800 0.9rem/1 ui-sans-serif, system-ui, sans-serif;
      border: 1px solid transparent;
    }

    .primary {
      background: var(--ember);
      color: #fffaf1;
    }

    .secondary {
      background: #fffdf8;
      color: var(--coal);
      border-color: var(--line);
    }

    .heat {
      flex: 1 1 220px;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font: 700 0.82rem/1 ui-sans-serif, system-ui, sans-serif;
      text-transform: uppercase;
    }

    input[type="range"] {
      accent-color: var(--ember);
      width: 100%;
    }

    .firebox {
      min-height: 172px;
      margin-top: 6px;
      background:
        linear-gradient(180deg, rgba(255, 253, 248, 0.22), transparent),
        radial-gradient(circle at 50% 92%, rgba(214, 95, 53, 0.8), transparent 28%),
        linear-gradient(160deg, var(--coal), #514436);
      position: relative;
      overflow: hidden;
      border-top: 1px solid rgba(40, 35, 29, 0.15);
      border-bottom: 1px solid rgba(40, 35, 29, 0.15);
    }

    .firebox::before {
      content: "";
      position: absolute;
      inset: 22px 14% 0;
      border: 2px solid rgba(255, 250, 241, 0.28);
      border-bottom: 0;
      border-radius: 50% 50% 0 0 / 70% 70% 0 0;
      background:
        radial-gradient(circle at 50% 100%, rgba(229, 174, 67, 0.82), transparent 30%),
        radial-gradient(circle at 36% 84%, rgba(127, 185, 155, 0.46), transparent 16%),
        radial-gradient(circle at 64% 72%, rgba(201, 135, 141, 0.44), transparent 18%);
      opacity: 0.92;
    }

    .spark {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 18px rgba(229, 174, 67, 0.8);
      animation: rise 3.6s infinite ease-in;
    }

    .spark:nth-child(1) { left: 27%; bottom: 28px; animation-delay: 0s; }
    .spark:nth-child(2) { left: 44%; bottom: 18px; animation-delay: 1.1s; }
    .spark:nth-child(3) { left: 58%; bottom: 26px; animation-delay: 0.45s; }
    .spark:nth-child(4) { left: 72%; bottom: 16px; animation-delay: 1.8s; }

    @keyframes rise {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      22% { opacity: 1; }
      100% { transform: translateY(-118px) scale(0.2); opacity: 0; }
    }

    .output {
      padding: 18px;
      display: grid;
      grid-template-columns: 1.25fr 0.85fr;
      gap: 14px;
      min-width: 0;
    }

    .take {
      grid-row: span 2;
      background: linear-gradient(180deg, #fffdf8 0%, #fff7e9 100%);
      border: 1px solid rgba(214, 95, 53, 0.26);
      border-radius: 8px;
      padding: 18px;
      box-shadow: inset 0 0 0 2px rgba(214, 95, 53, 0.08);
      display: grid;
      align-content: start;
      gap: 12px;
      min-width: 0;
    }

    .take h3 {
      font-size: 2.35rem;
      line-height: 1.02;
    }

    .take p,
    .tile p {
      margin: 0;
      color: var(--coal);
      line-height: 1.42;
    }

    .tile {
      background: rgba(255, 253, 248, 0.72);
      border: 1px solid rgba(40, 35, 29, 0.12);
      border-radius: 8px;
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 8px;
      min-width: 0;
    }

    .tile h3 {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    .question {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      background: var(--coal);
      color: #fffaf1;
      border-radius: 8px;
      padding: 16px;
    }

    .question p {
      margin: 0;
      line-height: 1.35;
    }

    .question button {
      border: 1px solid rgba(255, 250, 241, 0.36);
      background: transparent;
      color: #fffaf1;
      border-radius: 999px;
      padding: 10px 14px;
      font: 800 0.82rem/1 ui-sans-serif, system-ui, sans-serif;
      white-space: nowrap;
    }

    @media (max-width: 860px) {
      .shell {
        width: min(100% - 22px, 680px);
        padding-top: 16px;
      }

      header,
      main,
      .output,
      .question {
        grid-template-columns: 1fr;
      }

      header {
        align-items: start;
      }

      h1 {
        font-size: 2.55rem;
      }

      .take h3 {
        font-size: 1.72rem;
      }

      .garden-link {
        justify-self: start;
      }

      .bench {
        grid-template-rows: auto;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="eyebrow">Plot b1</div>
        <h1>Interesting Takes Engine</h1>
      </div>
      <a class="garden-link" href="../../../viewer/">Back to garden</a>
    </header>

    <main>
      <aside class="bench" aria-label="Signal bench">
        <section>
          <h2>Signals</h2>
          <div class="signal-stack" id="signals"></div>
        </section>

        <section>
          <h2>Values</h2>
          <div class="value-grid" id="values"></div>
        </section>

        <section class="voice-shelf">
          <h2>Voice Shelf</h2>
          <div class="voice-controls">
            <input id="voiceInput" type="text" maxlength="72" placeholder="A phrase, stance, or tone">
            <button id="voiceLike" type="button" title="Sounds like me" aria-label="Sounds like me">+</button>
            <button id="voiceAvoid" type="button" title="Not me" aria-label="Not me">-</button>
          </div>
          <div class="voice-list">
            <div class="voice-column">
              <h3>Keep</h3>
              <div id="voiceLikes"></div>
            </div>
            <div class="voice-column">
              <h3>Avoid</h3>
              <div id="voiceAvoids"></div>
            </div>
          </div>
        </section>

        <section>
          <h2>Saved Takes</h2>
          <div class="saved-stack" id="saved"></div>
        </section>

        <button class="secondary" id="clearSaved" type="button">Clear shelf</button>
      </aside>

      <section class="kiln" aria-label="Take kiln">
        <div class="kiln-top">
          <h2>Bring one signal. Fire one grounded take.</h2>
          <textarea id="signalInput" spellcheck="true"></textarea>
          <div class="actions">
            <button class="primary" id="fire" type="button">Fire take</button>
            <button class="secondary" id="save" type="button">Save take</button>
            <label class="heat" for="heat">
              Heat
              <input id="heat" type="range" min="0" max="4" value="2">
            </label>
          </div>
        </div>

        <div class="firebox" aria-hidden="true">
          <span class="spark"></span>
          <span class="spark"></span>
          <span class="spark"></span>
          <span class="spark"></span>
        </div>

        <div class="output" id="output">
          <article class="take">
            <h3 id="takeTitle"></h3>
            <p id="takeBody"></p>
          </article>
          <article class="tile">
            <h3>Metaphor</h3>
            <p id="metaphor"></p>
          </article>
          <article class="tile">
            <h3>Reality Check</h3>
            <p id="reality"></p>
          </article>
          <article class="tile">
            <h3>Older Echo</h3>
            <p id="echo"></p>
          </article>
          <article class="tile">
            <h3>Use It At Work</h3>
            <p id="work"></p>
          </article>
          <article class="question">
            <p id="question"></p>
            <button id="copy" type="button">Copy sentence</button>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script>
    const signalSeeds = [
      "AI agents are being pitched as teammates, but the real design problem may be handoff and accountability.",
      "Design tools are adding generative features faster than teams can name what good taste means.",
      "Synthetic user research is tempting because it is fast, but speed can hide whose reality is missing.",
      "AI browsers and assistants are starting to act on pages, not just summarize them.",
      "Small local models make intelligence feel less like a cloud product and more like a material.",
      "Evaluation is becoming a design practice: deciding what to measure is becoming part of the product."
    ];

    const values = [
      "clarity",
      "craft",
      "agency",
      "equity",
      "play",
      "calm"
    ];

    const lenses = [
      {
        title: "The take is about responsibility, not magic.",
        body: "A useful opinion here is that the impressive part is not what the system can do once, but who can notice when it should stop, ask, or explain itself.",
        metaphor: "It is like lending someone your keys, not buying a faster keychain. The question is less sparkle and more trust, boundaries, and return.",
        reality: "Real: delegation saves attention when the task has clear stakes and recovery paths. Hype: assuming autonomy removes the need for judgment.",
        echo: "This echoes older arguments about automation bias, participatory design, and Lucy Suchman's work on plans versus situated action.",
        work: "I would frame this as a handoff design problem: what does the AI need to show before I can responsibly let it continue?",
        question: "What would make this safe to delegate, and what would still need a human pause?"
      },
      {
        title: "The take is about taste becoming infrastructure.",
        body: "When AI makes ten options cheap, the scarce skill moves upstream: naming the criteria, rhythm, and exclusions that make one option worth keeping.",
        metaphor: "It is like setting a dinner table. More plates do not create taste; the meal starts to feel intentional when someone chooses what belongs together.",
        reality: "Real: generative tools widen exploration. Hype: pretending volume is the same as direction, or that polish is the same as judgment.",
        echo: "This connects to Christopher Alexander's pattern language and studio critique: shared criteria turn vague preference into teachable practice.",
        work: "My angle would be: AI does not erase design taste. It makes taste more visible because every prompt contains a theory of good.",
        question: "What taste rule is this feature smuggling in, and do we agree with it?"
      },
      {
        title: "The take is about missing people, not missing data.",
        body: "Synthetic insight can be useful as a rehearsal, but it becomes dangerous when it lets a team feel morally finished before meeting actual users.",
        metaphor: "It is like practicing a hard conversation in the mirror. Helpful before the room, dishonest if you call the mirror the meeting.",
        reality: "Real: simulated perspectives can sharpen hypotheses. Hype: treating generated personas as consent, evidence, or lived experience.",
        echo: "The older echo is feminist HCI and design justice: who gets represented, who benefits, and who absorbs the cost of being abstracted.",
        work: "I would use synthetic research as a draft of better questions, not as a replacement for hearing from people with stakes.",
        question: "Who becomes easier to ignore if we accept this synthetic answer?"
      },
      {
        title: "The take is about interfaces becoming negotiators.",
        body: "If assistants can act inside software, design shifts from arranging buttons to defining permissions, reversibility, and moments of consent.",
        metaphor: "It is like having someone help in your kitchen. Useful help is not only fast; it knows which drawer to open and when to ask first.",
        reality: "Real: action-taking interfaces can remove tedious coordination. Hype: believing every workflow wants to become invisible.",
        echo: "This returns to Sherry Turkle's questions about agency and to classic HCI concerns around direct manipulation and feedback.",
        work: "My take would be: the future interface is not no interface. It is a better contract between intent, action, and repair.",
        question: "Where should the product stay visible so the user can still feel in charge?"
      },
      {
        title: "The take is about intelligence becoming a material.",
        body: "As models get smaller and closer to the device, AI starts to feel less like one giant oracle and more like a texture designers can place carefully.",
        metaphor: "It is like lighting in a room. One ceiling lamp is blunt; many small lights can create privacy, mood, and precision.",
        reality: "Real: local models can improve latency, privacy, and resilience. Hype: assuming smaller automatically means safer or more understandable.",
        echo: "This recalls ubiquitous computing and calm technology: computation fades into context, which makes design responsibility harder, not lighter.",
        work: "I would argue for designing intelligence placement: what should happen near the user, what should leave the device, and why?",
        question: "Where does intelligence belong in this experience: center stage, edge, background, or nowhere?"
      },
      {
        title: "The take is about measurement shaping imagination.",
        body: "Evaluation is never neutral. The moment a team chooses a benchmark, it quietly chooses which futures are easy to defend.",
        metaphor: "It is like grading a meal only by calories. You learn something, but you may lose hospitality, memory, and delight.",
        reality: "Real: evals make quality discussable and regressions visible. Hype: believing a metric can carry the whole meaning of a product.",
        echo: "This echoes Goodhart's law, design critique, and older debates about what organizations can measure versus what people value.",
        work: "I would ask what the eval rewards, what it punishes, and what kind of product it makes politically convenient.",
        question: "What quality would disappear if this metric became the team's main truth?"
      }
    ];

    const heatWords = [
      ["careful", "I wonder if"],
      ["grounded", "I think"],
      ["direct", "The real issue is"],
      ["sharp", "The uncomfortable part is"],
      ["bold", "My strongest take is"]
    ];

    const els = {
      signals: document.querySelector("#signals"),
      values: document.querySelector("#values"),
      voiceInput: document.querySelector("#voiceInput"),
      voiceLike: document.querySelector("#voiceLike"),
      voiceAvoid: document.querySelector("#voiceAvoid"),
      voiceLikes: document.querySelector("#voiceLikes"),
      voiceAvoids: document.querySelector("#voiceAvoids"),
      saved: document.querySelector("#saved"),
      input: document.querySelector("#signalInput"),
      heat: document.querySelector("#heat"),
      fire: document.querySelector("#fire"),
      save: document.querySelector("#save"),
      clearSaved: document.querySelector("#clearSaved"),
      copy: document.querySelector("#copy"),
      takeTitle: document.querySelector("#takeTitle"),
      takeBody: document.querySelector("#takeBody"),
      metaphor: document.querySelector("#metaphor"),
      reality: document.querySelector("#reality"),
      echo: document.querySelector("#echo"),
      work: document.querySelector("#work"),
      question: document.querySelector("#question")
    };

    let activeSignal = 0;
    let selectedValues = new Set(JSON.parse(localStorage.getItem("b1.values") || '["clarity","agency"]'));
    let savedTakes = JSON.parse(localStorage.getItem("b1.savedTakes") || "[]");
    let voiceLikes = JSON.parse(localStorage.getItem("b1.voiceLikes") || '["I would frame this as"]');
    let voiceAvoids = JSON.parse(localStorage.getItem("b1.voiceAvoids") || '["obviously", "game changer"]');
    let currentTake = null;

    function hashText(text) {
      let hash = 0;
      for (let i = 0; i < text.length; i += 1) {
        hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      }
      return Math.abs(hash);
    }

    function renderSignals() {
      els.signals.innerHTML = "";
      signalSeeds.forEach((signal, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `signal${index === activeSignal ? " active" : ""}`;
        button.textContent = signal;
        button.addEventListener("click", () => {
          activeSignal = index;
          els.input.value = signal;
          renderSignals();
          fireTake();
        });
        els.signals.appendChild(button);
      });
    }

    function renderValues() {
      els.values.innerHTML = "";
      values.forEach((value) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `value${selectedValues.has(value) ? " active" : ""}`;
        button.textContent = value;
        button.addEventListener("click", () => {
          if (selectedValues.has(value)) {
            selectedValues.delete(value);
          } else {
            selectedValues.add(value);
          }
          if (selectedValues.size === 0) selectedValues.add(value);
          localStorage.setItem("b1.values", JSON.stringify([...selectedValues]));
          renderValues();
          fireTake();
        });
        els.values.appendChild(button);
      });
    }

    function renderSaved() {
      els.saved.innerHTML = "";
      if (savedTakes.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No saved takes yet.";
        els.saved.appendChild(empty);
        return;
      }
      savedTakes.slice(0, 8).forEach((take) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "saved";
        const values = document.createElement("strong");
        const sentence = document.createElement("span");
        values.textContent = take.values;
        sentence.textContent = take.sentence;
        item.append(values, sentence);
        item.addEventListener("click", () => {
          els.input.value = take.signal;
          els.heat.value = take.heat;
          fireTake();
        });
        els.saved.appendChild(item);
      });
    }

    function renderVoiceList(items, node, kind) {
      node.innerHTML = "";
      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = kind === "like" ? "No keepers yet." : "No avoids yet.";
        node.appendChild(empty);
        return;
      }

      items.slice(0, 6).forEach((phrase) => {
        const chip = document.createElement("div");
        chip.className = "voice-chip";
        const text = document.createElement("span");
        const remove = document.createElement("button");
        text.textContent = phrase;
        remove.type = "button";
        remove.textContent = "x";
        remove.setAttribute("aria-label", `Remove ${phrase}`);
        remove.addEventListener("click", () => {
          if (kind === "like") {
            voiceLikes = voiceLikes.filter((item) => item !== phrase);
            localStorage.setItem("b1.voiceLikes", JSON.stringify(voiceLikes));
          } else {
            voiceAvoids = voiceAvoids.filter((item) => item !== phrase);
            localStorage.setItem("b1.voiceAvoids", JSON.stringify(voiceAvoids));
          }
          renderVoice();
          fireTake();
        });
        chip.append(text, remove);
        node.appendChild(chip);
      });
    }

    function renderVoice() {
      renderVoiceList(voiceLikes, els.voiceLikes, "like");
      renderVoiceList(voiceAvoids, els.voiceAvoids, "avoid");
    }

    function addVoicePhrase(kind) {
      const phrase = els.voiceInput.value.trim().replace(/\s+/g, " ");
      if (!phrase) return;
      if (kind === "like") {
        voiceLikes = [phrase, ...voiceLikes.filter((item) => item.toLowerCase() !== phrase.toLowerCase())].slice(0, 8);
        voiceAvoids = voiceAvoids.filter((item) => item.toLowerCase() !== phrase.toLowerCase());
        localStorage.setItem("b1.voiceLikes", JSON.stringify(voiceLikes));
        localStorage.setItem("b1.voiceAvoids", JSON.stringify(voiceAvoids));
      } else {
        voiceAvoids = [phrase, ...voiceAvoids.filter((item) => item.toLowerCase() !== phrase.toLowerCase())].slice(0, 8);
        voiceLikes = voiceLikes.filter((item) => item.toLowerCase() !== phrase.toLowerCase());
        localStorage.setItem("b1.voiceAvoids", JSON.stringify(voiceAvoids));
        localStorage.setItem("b1.voiceLikes", JSON.stringify(voiceLikes));
      }
      els.voiceInput.value = "";
      renderVoice();
      fireTake();
    }

    function voiceBias(signal, lens) {
      const liked = voiceLikes[(hashText(signal + lens.title) + voiceLikes.length) % Math.max(voiceLikes.length, 1)];
      const avoided = voiceAvoids[(hashText(lens.body + signal) + voiceAvoids.length) % Math.max(voiceAvoids.length, 1)];
      return {
        keep: liked ? `Keep close to: "${liked}".` : "Keep the phrasing plain and owned.",
        avoid: avoided ? `Avoid the borrowed-feeling shortcut "${avoided}".` : "Avoid borrowed certainty."
      };
    }

    function fireTake() {
      const signal = els.input.value.trim() || signalSeeds[activeSignal];
      const chosen = [...selectedValues];
      const heat = Number(els.heat.value);
      const lens = lenses[(hashText(signal + chosen.join("")) + heat) % lenses.length];
      const [temper, opener] = heatWords[heat];
      const bias = voiceBias(signal, lens);
      const valueLine = chosen.length > 1
        ? `${chosen.slice(0, -1).join(", ")} and ${chosen[chosen.length - 1]}`
        : chosen[0];

      currentTake = {
        signal,
        heat,
        values: valueLine,
        sentence: `${opener}: ${lens.work} ${bias.keep}`
      };

      els.takeTitle.textContent = lens.title;
      els.takeBody.textContent = `Through ${valueLine}, this becomes a ${temper} take: ${lens.body} ${bias.avoid}`;
      els.metaphor.textContent = lens.metaphor;
      els.reality.textContent = lens.reality;
      els.echo.textContent = lens.echo;
      els.work.textContent = currentTake.sentence;
      els.question.textContent = lens.question;
    }

    function saveTake() {
      if (!currentTake) fireTake();
      savedTakes = [currentTake, ...savedTakes.filter((take) => take.sentence !== currentTake.sentence)].slice(0, 12);
      localStorage.setItem("b1.savedTakes", JSON.stringify(savedTakes));
      renderSaved();
    }

    function clearSaved() {
      savedTakes = [];
      localStorage.removeItem("b1.savedTakes");
      renderSaved();
    }

    async function copySentence() {
      if (!currentTake) fireTake();
      try {
        await navigator.clipboard.writeText(currentTake.sentence);
        els.copy.textContent = "Copied";
        setTimeout(() => {
          els.copy.textContent = "Copy sentence";
        }, 1100);
      } catch (error) {
        els.copy.textContent = "Select text";
      }
    }

    els.input.value = signalSeeds[0];
    els.fire.addEventListener("click", fireTake);
    els.save.addEventListener("click", saveTake);
    els.clearSaved.addEventListener("click", clearSaved);
    els.copy.addEventListener("click", copySentence);
    els.heat.addEventListener("input", fireTake);
    els.voiceLike.addEventListener("click", () => addVoicePhrase("like"));
    els.voiceAvoid.addEventListener("click", () => addVoicePhrase("avoid"));
    els.voiceInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") addVoicePhrase("like");
    });
    renderSignals();
    renderValues();
    renderVoice();
    renderSaved();
    fireTake();
  </script>
</body>
</html>
